name: STAB-03 T02 Library Containment Repair

on:
  push:
    branches:
      - work/stab03-t02-library-containment

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stab03-t02-library-containment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore baseline S0F1b and apply narrow layout-only change
        run: |
          node --check .github/stab03-t02-library-s0f1b-repair.mjs
          node .github/stab03-t02-library-s0f1b-repair.mjs
          node --check "src-surfaces-base/studio/S0F1b. 🎬 Library Workspace - Studio.js"

      - name: Verify S0F1b unrelated helpers preserved
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('src-surfaces-base/studio/S0F1b. 🎬 Library Workspace - Studio.js','utf8');
          const required = [
            'function isFresh(slot)',
            'function setCache(slot, value)',
            'function bustCaches(reason)',
            'function LW_isTauri()',
            'function getStudioStores()',
            'function projectFolderRowForWorkspace(row)',
            'function projectCategoryRowForWorkspace(row)',
            'function projectLabelRowForWorkspace(row)',
            'async function desktopFetchCatalog(slot, name, sqliteFetcher)',
            "async function getKnownChats({ view = 'saved'",
            'async function getFolders({ fresh = false } = {})',
          ];
          for (const needle of required) {
            if (!s.includes(needle)) throw new Error('S0F1b unrelated helper missing: ' + needle);
          }
          const saveStart = s.indexOf('  function saveLayout(patch) {');
          const modelStart = s.indexOf('\n\n  // ── Cache helpers', saveStart);
          const block = s.slice(saveStart, modelStart);
          if (!block.includes('store.set(LAYOUT_KEY, next)')) throw new Error('saveLayout Store write missing');
          if (block.includes('localStorage.setItem') || block.includes('localStorage.removeItem')) throw new Error('saveLayout direct persistence remains');
          console.log('S0F1B_NARROW_SCOPE_INTEGRITY=PASS');
          NODE

      - name: Re-run focused Library slice validator
        run: |
          git show 0766a9f99b44d059775e751e88596eb1c25a41bc:.github/stab03-t02-library-validate.mjs > /tmp/stab03-t02-library-validate.mjs
          node /tmp/stab03-t02-library-validate.mjs

      - name: Re-run accepted STAB-P0 contracts and package refs
        run: |
          node tools/validation/studio/validate-stab-p0-t02a-folder-command-contract.mjs
          node tools/validation/studio/validate-stab-p0-t02b-shell-folder-contribution-seam.mjs
          node tools/validation/studio/validate-stab-p0-t03-library-folder-integration.mjs
          node tools/validation/studio/validate-stab-p0-ac04-library-catalog-fanout.mjs
          node tools/product/studio/__smoke__/pack-refcheck.smoke.mjs

      - name: Verify exact routed write set
        env:
          BASE: c0bcee76b9ccf241a85b738dcc2b9ba482c3e4dd
        run: |
          rm -f .github/stab03-t02-library-s0f1b-repair.mjs .github/workflows/stab03-t02-library-containment-repair.yml
          git diff --check
          git config core.quotePath false
          actual="$(git diff --name-only "$BASE" | sort)"
          expected="$(printf '%s\n' \
            'src-surfaces-base/studio/S0F1b. 🎬 Library Workspace - Studio.js' \
            'src-surfaces-base/studio/S0F1c. 🎬 Library Index - Studio.js' \
            'src-surfaces-base/studio/S0F1d. 🎬 Library Insights - Studio.js' \
            'src-surfaces-base/studio/S0F1k. 🎬 Library Canonical Services - Studio.js' \
            'src-surfaces-base/studio/S0F5a. 🎬 Tags - Studio.js' \
            'src-surfaces-base/studio/S9D1a. 🎬 Auto Emoji Title - Studio.js' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected STAB-03 T02-LIBRARY diff:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Commit repaired validated candidate
        run: |
          git config user.name "H2O STAB-03 Library"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Studio: narrow STAB-03 Library workspace persistence edit"
          git push origin HEAD:work/stab03-t02-library-containment
