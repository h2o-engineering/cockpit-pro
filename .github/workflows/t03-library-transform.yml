name: STAB-P0 T03 Library Transform

on:
  push:
    branches:
      - t03-library-folder-integration

permissions:
  contents: write

jobs:
  transform-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t03-library-folder-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded Library-owned T03 transform
        run: |
          base64 -d .github/t03-transform.mjs.gz.b64 | gzip -d > /tmp/t03-library-transform.mjs
          node --check /tmp/t03-library-transform.mjs
          node /tmp/t03-library-transform.mjs
          node --check "src-surfaces-base/studio/S0Z1g. 🎬 Library Sidebar Sections - Studio.js"
      - name: Run targeted T03 validations
        run: |
          node tools/validation/studio/validate-stab-p0-t03-library-folder-integration.mjs
          node tools/validation/studio/validate-stab-p0-t02a-folder-command-contract.mjs
          node tools/validation/studio/validate-stab-p0-t02b-shell-folder-contribution-seam.mjs
      - name: Commit validated branch result
        run: |
          rm -f .github/t03-transform.mjs.gz.b64 .github/workflows/t03-library-transform.yml
          git config user.name "H2O T03 Library Transform"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "STAB-P0 T03: integrate Library folders through Shell seam"
          git push origin HEAD:t03-library-folder-integration
