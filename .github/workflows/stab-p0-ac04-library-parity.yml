name: STAB-P0 AC04 Library Parity

on:
  push:
    branches:
      - work/stab-p0-ac04-library-parity

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stab-p0-ac04-library-parity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded AC04 Library correction
        run: |
          node --check .github/ac04-library-parity-transform.mjs
          node .github/ac04-library-parity-transform.mjs
          node --check "src-surfaces-base/studio/S0F1c. 🎬 Library Index - Studio.js"
          node --check tools/validation/studio/validate-stab-p0-ac04-library-catalog-fanout.mjs

      - name: Run focused AC04 and accepted STAB-P0 validators
        run: |
          node tools/validation/studio/validate-stab-p0-ac04-library-catalog-fanout.mjs
          node tools/validation/studio/validate-stab-p0-t02a-folder-command-contract.mjs
          node tools/validation/studio/validate-stab-p0-t02b-shell-folder-contribution-seam.mjs
          node tools/validation/studio/validate-stab-p0-t03-library-folder-integration.mjs

      - name: Run targeted regression and boundary validators
        run: |
          node tools/validation/sync/validate-f19-sync-hardening.mjs
          node tools/validation/sync/validate-p02-desktop-relationship-materialization.mjs

      - name: Verify exact authorized Product scope
        env:
          BASE: 99440a275dcfb1a92c3f219d3695ae62b19324df
        run: |
          rm -f .github/ac04-library-parity-transform.mjs .github/workflows/stab-p0-ac04-library-parity.yml
          git diff --check
          actual="$(git diff --name-only "$BASE" | sort)"
          expected="$(printf '%s\n' \
            'src-surfaces-base/studio/S0F1c. 🎬 Library Index - Studio.js' \
            'tools/validation/studio/validate-stab-p0-ac04-library-catalog-fanout.mjs' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected AC04 Product diff:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Commit validated branch result
        run: |
          git config user.name "H2O STAB-P0 AC04 Library"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Studio: fix STAB-P0 AC04 catalog-only Folder fan-out"
          git push origin HEAD:work/stab-p0-ac04-library-parity
